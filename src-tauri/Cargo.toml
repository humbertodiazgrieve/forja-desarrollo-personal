[package]
name = "forja"
version = "1.0.0"
description = "Tu progreso, tu leyenda"
authors = ["Forja"]
edition = "2021"
autobins = false
default-run = "ForjaApp"

[[bin]]
name = "ForjaApp"
path = "src/main.rs"

[lib]
name = "forja_lib"
test = false
doctest = false
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
